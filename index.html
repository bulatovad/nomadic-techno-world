<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Кочевая технологическая цивилизация</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Основная сцена мира -->
    <main class="world">

        <!-- Фоновая иллюстрация -->
        <div class="world-background"></div>

        <button class="brief-info" id="historyOpen">
            <span>i</span>
        </button>

        <div class="history-modal" id="historyModal">
            <button class="modal-close" id="historyClose">×</button>

            <div class="history-page history-left">
                <span id="historyCategory"></span>
                <h1 id="historyTitle"></h1>
            </div>

            <div class="history-page history-right">
                <p id="historyDescription"></p>
            </div>
        </div>

        <div class="language-switcher">
            <button data-lang="kk">ҚАЗ</button>
            <button data-lang="ru">РУС</button>
            <button data-lang="en">ENG</button>
        </div>

        <!-- Интерактивные объекты -->
        <section class="world-objects">

            <!-- Ходячий дом -->
            <button class="world-object walking-house" data-object="walking-house" aria-label="Ходячий дом">
                <img src="assets/walking-house.png" alt="Ходячий дом">
            </button>

            <!-- Робот-паук -->
            <button class="world-object spider-robot" data-object="spider-robot" aria-label="Робот-паук">
                <img src="assets/spider-robot.png" alt="Робот-паук">
            </button>

            <!-- Смарт-центр -->
            <button class="world-object smart-center" data-object="smart-center" aria-label="Смарт-центр">
                <img src="assets/smart-center.png" alt="Смарт-центр">
            </button>

            <!-- Дрон-беркут -->
            <button class="world-object berkut" data-object="berkut" aria-label="Дрон Беркут">
                <img src="assets/berkut.png" alt="Дрон Беркут">
            </button>

            <!-- Спутник -->
            <button class="world-object satellite" data-object="satellite" aria-label="Спутник">
                <img src="assets/satellite.png" alt="Спутник">
            </button>

        </section>

        <!-- Затемнение фона -->
        <div class="modal-overlay" id="modalOverlay"></div>


        <!-- Окно информации -->
        <div class="info-modal" id="infoModal">

            <button class="modal-close" id="modalClose">
                ×
            </button>

            <div class="modal-image">
                <img id="modalImage" src="" alt="">
            </div>

            <div class="modal-content">

                <span class="modal-category" id="modalCategory">
                    Объект
                </span>

                <h1 id="modalTitle">
                    Название
                </h1>

                <p id="modalDescription">
                    Описание объекта.
                </p>

                <div class="modal-details" id="modalDetails">
                </div>

            </div>

        </div>

        <div class="scheme-viewer" id="schemeViewer">
            <button class="scheme-close" id="schemeClose" aria-label="Закрыть схему">×</button>

            <img id="schemeViewerImage" src="" alt="">
        </div>

    </main>

    <footer>
        <p>© 2026 <span class="author">Nomadic Techno World</span></p>
        <p>Изображения фона и объектов сгенерированы искусственным интеллектом</p>
    </footer>

    <script src="js/i18n.js"></script>
    <script src="js/main.js"></script>

</body>

</html>
